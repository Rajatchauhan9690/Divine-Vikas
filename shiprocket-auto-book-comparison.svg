<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
  <title id="title">Shiprocket order fulfillment: automatic booking on or off</title>
  <desc id="description">Comparison of manual Shiprocket shipment booking when automatic booking is false and automatic shipment booking after payment when true. In both cases an admin packs and hands over the parcel, then tracking updates the order.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f7ff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6941c6"/>
      <stop offset="1" stop-color="#7f56d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#27324a" flood-opacity=".10"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #20283a; }
      .title { font-size: 38px; font-weight: 750; letter-spacing: -.5px; }
      .subtitle { font-size: 17px; fill: #5d677c; }
      .card-title { font-size: 23px; font-weight: 700; fill: #fff; }
      .step-title { font-size: 16px; font-weight: 700; }
      .step-copy { font-size: 13px; fill: #596579; }
      .badge { font-size: 13px; font-weight: 700; }
      .footer-head { font-size: 16px; font-weight: 700; fill: #fff; }
      .footer-copy { font-size: 14px; fill: #e8eaf2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9aa5b7"/>
    </marker>
  </defs>

  <rect width="1440" height="1120" fill="url(#background)"/>
  <circle cx="1330" cy="90" r="115" fill="#e4dcff" opacity=".45"/>
  <circle cx="85" cy="1030" r="145" fill="#d9eaff" opacity=".55"/>

  <text x="720" y="77" text-anchor="middle" class="title">How Shiprocket order booking works</text>
  <text x="720" y="110" text-anchor="middle" class="subtitle">The setting controls who books the shipment. Packing, pickup and delivery tracking still need to happen.</text>

  <g filter="url(#shadow)">
    <rect x="65" y="150" width="625" height="670" rx="22" fill="#fff"/>
    <rect x="750" y="150" width="625" height="670" rx="22" fill="#fff"/>
  </g>

  <path d="M87 150h581a22 22 0 0 1 22 22v66H65v-66a22 22 0 0 1 22-22Z" fill="#536176"/>
  <text x="100" y="197" class="card-title">AUTO BOOK = false</text>
  <rect x="500" y="174" width="154" height="36" rx="18" fill="#fff" opacity=".17"/>
  <text x="577" y="197" text-anchor="middle" class="badge" fill="#fff">MANUAL BOOKING</text>

  <path d="M772 150h581a22 22 0 0 1 22 22v66H750v-66a22 22 0 0 1 22-22Z" fill="url(#purple)"/>
  <text x="785" y="197" class="card-title">AUTO BOOK = true</text>
  <rect x="1192" y="174" width="154" height="36" rx="18" fill="#fff" opacity=".18"/>
  <text x="1269" y="197" text-anchor="middle" class="badge" fill="#fff">AUTO BOOKING</text>

  <!-- Manual flow -->
  <g>
    <rect x="105" y="267" width="545" height="74" rx="14" fill="#f3f5f8" stroke="#e2e7ee"/>
    <circle cx="137" cy="304" r="18" fill="#dce3ed"/><text x="137" y="310" text-anchor="middle" class="badge">1</text>
    <text x="169" y="297" class="step-title">Customer payment succeeds</text>
    <text x="169" y="320" class="step-copy">The order appears in Admin → Orders as paid.</text>
    <path d="M377 343v19" stroke="#9aa5b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="105" y="368" width="545" height="90" rx="14" fill="#f3f5f8" stroke="#e2e7ee"/>
    <circle cx="137" cy="413" r="18" fill="#dce3ed"/><text x="137" y="419" text-anchor="middle" class="badge">2</text>
    <text x="169" y="400" class="step-title">Admin enters package details</text>
    <text x="169" y="423" class="step-copy">Enter parcel weight and dimensions, then find couriers.</text>
    <text x="169" y="442" class="step-copy">Choose an available courier and its quoted rate.</text>
    <path d="M377 460v19" stroke="#9aa5b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="105" y="485" width="545" height="90" rx="14" fill="#f3f5f8" stroke="#e2e7ee"/>
    <circle cx="137" cy="530" r="18" fill="#dce3ed"/><text x="137" y="536" text-anchor="middle" class="badge">3</text>
    <text x="169" y="517" class="step-title">Admin creates shipment and label</text>
    <text x="169" y="540" class="step-copy">Shiprocket books it, returns an AWB/tracking number</text>
    <text x="169" y="559" class="step-copy">and label; the order status changes to Processing.</text>
    <path d="M377 577v19" stroke="#9aa5b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="105" y="602" width="545" height="74" rx="14" fill="#eef8f3" stroke="#d7eee1"/>
    <circle cx="137" cy="639" r="18" fill="#cdebd9"/><text x="137" y="645" text-anchor="middle" class="badge">4</text>
    <text x="169" y="632" class="step-title">Pack parcel and hand it to courier</text>
    <text x="169" y="655" class="step-copy">The admin/store still arranges physical handover.</text>
    <path d="M377 678v19" stroke="#9aa5b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="105" y="703" width="545" height="74" rx="14" fill="#eef8f3" stroke="#d7eee1"/>
    <circle cx="137" cy="740" r="18" fill="#cdebd9"/><text x="137" y="746" text-anchor="middle" class="badge">5</text>
    <text x="169" y="733" class="step-title">Tracking updates order status</text>
    <text x="169" y="756" class="step-copy">Courier scans update it to Shipped, then Delivered.</text>
  </g>

  <!-- Automatic flow -->
  <g>
    <rect x="790" y="267" width="545" height="74" rx="14" fill="#f5f1ff" stroke="#e7ddff"/>
    <circle cx="822" cy="304" r="18" fill="#e2d7ff"/><text x="822" y="310" text-anchor="middle" class="badge">1</text>
    <text x="854" y="297" class="step-title">Customer payment succeeds</text>
    <text x="854" y="320" class="step-copy">The server starts shipment booking after verified payment.</text>
    <path d="M1062 343v19" stroke="#9aa5b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="790" y="368" width="545" height="90" rx="14" fill="#f5f1ff" stroke="#e7ddff"/>
    <circle cx="822" cy="413" r="18" fill="#e2d7ff"/><text x="822" y="419" text-anchor="middle" class="badge">2</text>
    <text x="854" y="400" class="step-title">Server prepares package and courier search</text>
    <text x="854" y="423" class="step-copy">Product weights + packaging tare; configured box</text>
    <text x="854" y="442" class="step-copy">dimensions and courier strategy are used.</text>
    <path d="M1062 460v19" stroke="#9aa5b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="790" y="485" width="545" height="90" rx="14" fill="#f5f1ff" stroke="#e7ddff"/>
    <circle cx="822" cy="530" r="18" fill="#e2d7ff"/><text x="822" y="536" text-anchor="middle" class="badge">3</text>
    <text x="854" y="517" class="step-title">Server books shipment automatically</text>
    <text x="854" y="540" class="step-copy">Requests AWB/tracking number and label from Shiprocket;</text>
    <text x="854" y="559" class="step-copy">saves them and changes order status to Processing.</text>
    <path d="M1062 577v19" stroke="#9aa5b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="790" y="602" width="545" height="74" rx="14" fill="#eef8f3" stroke="#d7eee1"/>
    <circle cx="822" cy="639" r="18" fill="#cdebd9"/><text x="822" y="645" text-anchor="middle" class="badge">4</text>
    <text x="854" y="632" class="step-title">Admin packs parcel and hands it to courier</text>
    <text x="854" y="655" class="step-copy">Automation books it; it does not physically dispatch it.</text>
    <path d="M1062 678v19" stroke="#9aa5b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="790" y="703" width="545" height="74" rx="14" fill="#eef8f3" stroke="#d7eee1"/>
    <circle cx="822" cy="740" r="18" fill="#cdebd9"/><text x="822" y="746" text-anchor="middle" class="badge">5</text>
    <text x="854" y="733" class="step-title">Tracking updates order status</text>
    <text x="854" y="756" class="step-copy">Courier scans update it to Shipped, then Delivered.</text>
  </g>

  <rect x="65" y="855" width="1310" height="195" rx="22" fill="#252d40"/>
  <text x="105" y="898" class="footer-head">Important</text>
  <text x="105" y="930" class="footer-copy">• AUTO_BOOK = false: payment does not book shipping; an admin completes the shipment steps.</text>
  <text x="105" y="959" class="footer-copy">• AUTO_BOOK = true: set the server environment variable to true and configure Shiprocket, product weights and package settings.</text>
  <text x="105" y="988" class="footer-copy">• If automatic booking can’t complete, the order needs manual fulfillment in Admin → Orders.</text>
  <text x="105" y="1017" class="footer-copy">• In both modes, Processing means booked/being prepared—not picked up. Tracking updates come after courier scans.</text>

  <text x="720" y="1085" text-anchor="middle" font-size="12" fill="#707b8e">DIVINE VIKAS · SHIPROCKET FULFILLMENT</text>
</svg>
